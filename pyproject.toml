[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-intel"
version = "1.0.6"
description = "Crawl a site and a competitor, extract main content, find cannibalization and gaps, optimise internal links, and write a claim-verified action plan."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "lxml>=5.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "psutil>=5.9",
  "anthropic>=0.40",
  "playwright>=1.40",
  "pytest>=7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
seo-intel = "seo_intel.cli:main"
seo-intel-eval = "seo_intel.evalcli:main"

[tool.setuptools.packages.find]
include = ["seo_intel*"]
